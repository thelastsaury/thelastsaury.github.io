<section class="content"><h2>故事与我的分工</h2><p>两名玩家从沙滩的大钟出发，跟随动物的线索探索小岛，最后救出蜥蜴，回到沙滩修复大钟。</p><p>我负责故事主线、角色对话、任务流程与双人机关设计，并借助 AI 把构思做成可游玩的场景和机关。</p></section>
<section class="content"><h2>两个人怎样打开路</h2><div class="pair">
<figure><img src="assets/beach.jpeg" alt="沙滩关卡，门前有两个按钮" loading="lazy"><figcaption><strong>沙滩 · 同时按下按钮</strong><br>两人可以分头找贝壳，但开门需要同时按下按钮。独立探索在这里过渡到同步合作。</figcaption></figure>
<figure><img src="assets/volcano.jpeg" alt="火山关卡，玩家要通过分开的平台" loading="lazy"><figcaption><strong>火山 · 解锁同伴的落脚点</strong><br>玩家每踩上一处平台，就为对方解锁下一处落脚点。两人靠接力才能一起前进。</figcaption></figure>
</div></section>
<section class="content"><h2>让前一关的道具派上用场</h2><p>治愈古树后，玩家从小鸟那里得到滑翔羽毛。到了天空岛，羽毛能帮助他们接近云团羊，把森林任务和后续关卡连在一起。</p></section>
